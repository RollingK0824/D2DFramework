name: D2DFramework Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Package Release
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    - name: Run vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: 'c35a8286a51d9cf1639d675661b0c007137f225c'

    - name: Restore NuGet Packages
      run: nuget restore D2DFramework.sln

    - name: Build Release Version
      run: |
        msbuild D2DFramework.sln /p:Configuration=Release /p:Platform=x64 /m /verbosity:minimal

    - name: Prepare Release Package
      shell: powershell
      run: |
        $Staging = "D2DFramework_Release"
        New-Item -ItemType Directory -Force -Path $Staging
        
        # 1. Executable, DLLs, and config files
        if (Test-Path "x64\Release\D2DFramework.exe") {
            Copy-Item "x64\Release\D2DFramework.exe" -Destination $Staging
        }
        Copy-Item "x64\Release\*.dll" -Destination $Staging -ErrorAction SilentlyContinue

        if (Test-Path "D2DFramework\imgui.ini") {
            Copy-Item "D2DFramework\imgui.ini" -Destination $Staging
        }
        
        # 2. Include Resources and Source if present
        if (Test-Path "D2DFramework\Resources") {
            Copy-Item -Recurse "D2DFramework\Resources" -Destination "$Staging\Resources"
        }
        if (Test-Path "D2DFramework\Source") {
            Copy-Item -Recurse "D2DFramework\Source" -Destination "$Staging\Source"
        }
        
        # 3. Create Zip file
        Compress-Archive -Path "$Staging\*" -DestinationPath "D2DFramework_${{ github.ref_name }}_x64.zip"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: D2DFramework_${{ github.ref_name }}_x64.zip
        name: D2DFramework ${{ github.ref_name }}
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
